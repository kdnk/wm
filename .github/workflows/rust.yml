name: rust

on:
  workflow_call:
    inputs:
      source_sha:
        required: false
        type: string
        default: ""
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: rust-ci-${{ github.workflow }}-${{ inputs.source_sha || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: "-C debuginfo=0"

jobs:
  format:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - name: Format Check
        run: cargo +nightly fmt --all --check --verbose

  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@nextest
      - uses: Swatinem/rust-cache@v2
      - name: Compile
        run: cargo check --locked
      - name: Verify imported desktop checks
        run: |
          python3 tests/rift-settings-focus-verifier-test.py
          python3 tests/rift-multi-resize-verifier-test.py
      - name: Verify release signing setup
        run: python3 tests/release-signing-setup-test.py
      - name: Verify release automation
        run: python3 tests/release-workflow-test.py
      - name: Test exact capture
        run: cargo test --locked --manifest-path cgs/Cargo.toml --lib exact_capture -- --test-threads=1
      # settings_native drives real AppKit windows, which is flaky on headless CI runners.
      # It is ignored by default; run it locally with
      # `cargo nextest run --run-ignored all -E 'binary(settings_native)'`.
      - name: Test
        run: cargo nextest run -E 'not binary(settings_native)'
