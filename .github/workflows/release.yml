# Modified by kdnk for wm on 2026-11-14. Original attribution is preserved in LICENSE.
name: release

on:
  push:
    branches: [main]
    paths: [Cargo.toml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wm-release-${{ github.sha }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
  ASSET_BASENAME: wm-universal-macos
  RELEASE_REPOSITORY: ${{ github.repository }}

jobs:
  prepare:
    name: Plan version release
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.plan.outputs.release }}
      sha: ${{ steps.plan.outputs.sha }}
      tag: ${{ steps.plan.outputs.tag }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Plan release from the root package version
        id: plan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SHA: ${{ github.sha }}
          BEFORE: ${{ github.event.before || '0000000000000000000000000000000000000000' }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 scripts/release.py plan --repo "$RELEASE_REPOSITORY" \
            --sha "$RELEASE_SHA" --before "$BEFORE" --event "$EVENT_NAME" \
            --output "$GITHUB_OUTPUT"

  verify:
    needs: prepare
    if: needs.prepare.outputs.release == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/rust.yml
    with:
      source_sha: ${{ needs.prepare.outputs.sha }}

  tag:
    name: Create immutable version tag
    needs: [prepare, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - name: Create or verify the version tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          python3 scripts/release.py tag --repo "$RELEASE_REPOSITORY" \
            --sha "$RELEASE_SHA" --tag "$RELEASE_TAG"

  build:
    name: Build (${{ matrix.target }})
    needs: [prepare, tag]
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]

    steps:
      - name: Checkout source at release tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Install Rust and target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Verify build toolchain
        run: |
          set -euo pipefail
          rustc -V
          cargo -V
          rustup target list --installed
          sw_vers

      - name: Build release
        run: |
          set -euxo pipefail
          cargo build --release --locked --package wm \
            --bin wm --bin wm-cli --target "${{ matrix.target }}"

      - name: Bundle architecture binaries
        run: |
          set -euxo pipefail
          mkdir -p artifacts
          tar -C "target/${{ matrix.target }}/release" \
            -czf "artifacts/${{ matrix.target }}.tar.gz" wm wm-cli

      - name: Upload architecture binaries
        uses: actions/upload-artifact@v4
        with:
          name: wm-${{ matrix.target }}
          path: artifacts/${{ matrix.target }}.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

  publish:
    name: Package and publish universal release
    needs: [prepare, build]
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
    runs-on: macos-26

    steps:
      - name: Checkout source at release tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Download architecture binaries
        uses: actions/download-artifact@v4
        with:
          pattern: wm-*-apple-darwin
          path: artifacts
          merge-multiple: true

      - name: Create universal binaries
        run: |
          set -euxo pipefail
          mkdir -p dist
          for arch in aarch64-apple-darwin x86_64-apple-darwin; do
            test -s "artifacts/${arch}.tar.gz"
            mkdir -p "slices/${arch}"
            tar -xzf "artifacts/${arch}.tar.gz" -C "slices/${arch}"
          done
          lipo -create \
            slices/aarch64-apple-darwin/wm \
            slices/x86_64-apple-darwin/wm \
            -output dist/wm
          lipo -create \
            slices/aarch64-apple-darwin/wm-cli \
            slices/x86_64-apple-darwin/wm-cli \
            -output dist/wm-cli
          strip -x dist/wm dist/wm-cli
          chmod +x dist/wm dist/wm-cli
          for bin in dist/wm dist/wm-cli; do
            for arch in arm64 x86_64; do
              lipo "$bin" -verify_arch "$arch"
            done
          done

      - name: Import signing certificate
        uses: apple-actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.WM_SIGNING_P12 }}
          p12-password: ${{ secrets.WM_SIGNING_PASSWORD }}

      - name: Verify pinned signing certificate
        run: |
          set -euo pipefail
          openssl x509 -in assets/release-signing.pem -checkend 0 -noout
          security find-certificate -c "wm Release Signing" -p signing_temp.keychain \
            > "$RUNNER_TEMP/wm.crt"
          expected=$(openssl x509 -in assets/release-signing.pem -noout -fingerprint -sha256)
          actual=$(openssl x509 -in "$RUNNER_TEMP/wm.crt" -noout -fingerprint -sha256)
          if [[ "$actual" != "$expected" ]]; then
            echo "The imported signing identity differs from assets/release-signing.pem." >&2
            exit 1
          fi

      - name: Trust signing certificate
        run: |
          sudo security add-trusted-cert \
            -d -r trustRoot -p codeSign \
            -k /Library/Keychains/System.keychain \
            "$RUNNER_TEMP/wm.crt"

      - name: Sign release binaries
        run: |
          set -euo pipefail

          SIGNER=$(openssl x509 -in "$RUNNER_TEMP/wm.crt" \
            -noout -fingerprint -sha1 |
            cut -d= -f2 | tr -d ':')

          security find-identity -v -p codesigning \
            signing_temp.keychain | grep -F "$SIGNER"

          codesign --force --timestamp=none \
            --keychain signing_temp.keychain \
            --sign "$SIGNER" \
            --identifier git.kdnk.wm \
            dist/wm

          codesign --force --timestamp=none \
            --keychain signing_temp.keychain \
            --sign "$SIGNER" \
            --identifier git.kdnk.wm.cli \
            dist/wm-cli

          codesign --verify --verbose=2 dist/wm
          codesign --verify --verbose=2 dist/wm-cli
          codesign -dr - dist/wm


      - name: Package tarball
        id: pkg
        run: |
          set -euxo pipefail
          VERSION="${RELEASE_TAG#v}"
          ASSET="${ASSET_BASENAME}-${VERSION}.tar.gz"
          test -s wm.default.toml
          cp wm.default.toml dist/wm.default.toml
          cp assets/release-signing.pem dist/release-signing.pem
          mkdir -p dist/licenses/cgs
          cp LICENSE dist/licenses/wm-LICENSE
          cp NOTICE dist/licenses/wm-NOTICE
          cp cgs/LICENSE dist/licenses/cgs/LICENSE
          cp cgs/third-party/ProgressiveBlurHeader.LICENSE dist/licenses/cgs/ProgressiveBlurHeader.LICENSE
          tar -C dist -czf "$ASSET" wm wm-cli wm.default.toml release-signing.pem licenses
          sha256=$(shasum -a 256 "$ASSET" | awk '{print $1}')
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "asset=${ASSET}" >> "$GITHUB_OUTPUT"
          echo "sha256=${sha256}" >> "$GITHUB_OUTPUT"

      - name: Verify packaged binary versions
        env:
          VERSION: ${{ steps.pkg.outputs.version }}
        run: |
          set -euo pipefail
          test "$(dist/wm --version)" = "wm ${VERSION}"
          test "$(dist/wm-cli --version)" = "wm-cli ${VERSION}"
          test -s dist/wm.default.toml

      - name: Create or complete GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ASSET: ${{ steps.pkg.outputs.asset }}
        run: |
          set -euo pipefail
          python3 scripts/release.py publish --repo "$RELEASE_REPOSITORY" \
            --sha "$RELEASE_SHA" --tag "$RELEASE_TAG" --asset "$ASSET"
